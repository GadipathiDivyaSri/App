<!DOCTYPE html>
<html>
<head>
  <base href="./">

  <script>
    (function() {
      var base = document.querySelector('base');
      if (!base) {
        base = document.createElement('base');
        document.head.prepend(base);
      }
      base.setAttribute('href', './');
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WrindhaOS Productivity & Life Management App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WrindhaOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WrindhaOS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FAF7F2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FAF7F2;
      z-index: 999999;
      transition: opacity 0.3s ease;
      font-family: inherit;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3.5px solid #E2E8F0;
      border-top-color: #0D5CE5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div style="font-size: 26px; font-weight: 800; color: #1E293B; margin-bottom: 16px; letter-spacing: -0.5px;">Wrindha<span style="color: #0D5CE5;">OS</span></div>
    <div class="spinner"></div>
    <div style="font-size: 13px; color: #64748B; margin-top: 14px; font-weight: 500;">Loading application...</div>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    function removeLoading() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function () {
          if (loading && loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 300);
      }
    }

    window.addEventListener('flutter-first-frame', removeLoading);

    window.addEventListener('load', function () {
      if (window._flutter && window._flutter.loader) {
        window._flutter.loader.loadEntrypoint({
          entrypointUrl: 'main.dart.js?v=' + Date.now(),
          onEntrypointLoaded: async function (engineInitializer) {
            try {
              const appRunner = await engineInitializer.initializeEngine();
              await appRunner.runApp();
              removeLoading();
            } catch (err) {
              console.error('Engine init error:', err);
              removeLoading();
            }
          }
        });
      } else {
        var script = document.createElement('script');
        script.src = 'main.dart.js?v=' + Date.now();
        script.onload = removeLoading;
        document.body.appendChild(script);
      }
    });

    setTimeout(removeLoading, 4000);
  </script>
</body>
</html>
