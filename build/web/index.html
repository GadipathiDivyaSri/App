<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WrindhaOS Productivity App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>WrindhaOS</title>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FFF9F0;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFF9F0;
      z-index: 9999;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #E2E8F0;
      border-top-color: #0D5CE5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 16px; font-weight: 600; font-size: 15px; color: #1E293B;">Starting WrindhaOS...</p>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) { r.unregister(); }
        });
      }

      _flutter.loader.loadEntrypoint({
        entrypointUrl: 'main.dart.js?v=' + Date.now(),
        onEntrypointLoaded: async function(engineInitializer) {
          try {
            let appRunner = await engineInitializer.initializeEngine({
              useColorEmoji: true,
            });
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
            await appRunner.runApp();
          } catch (e) {
            console.error('Engine initialization error:', e);
            const loading = document.getElementById('loading');
            if (loading) loading.innerText = 'Failed to load: ' + e;
          }
        }
      });
    });
  </script>
</body>
</html>
