<!DOCTYPE html>
<html>
<head>
  <!-- Dynamic Base Detection for GitHub Pages /App/ or root / -->
  <script>
    (function() {
      var path = window.location.pathname;
      var baseHref = path.indexOf('/App') !== -1 ? '/App/' : './';
      var baseEl = document.createElement('base');
      baseEl.href = baseHref;
      document.head.appendChild(baseEl);
      
      // Unregister any stale/stuck service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WrindhaOS Productivity App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>WrindhaOS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFF9F0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
