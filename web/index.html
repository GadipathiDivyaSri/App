<!DOCTYPE html>
<html>
<head>
  <!-- Dynamic Base Href Auto-Detection for Root and Subpaths (/App/, /WRINDHA_OS_APP/, /) -->
  <script>
    (function() {
      var baseEl = document.querySelector('base');
      if (!baseEl) {
        baseEl = document.createElement('base');
        document.head.prepend(baseEl);
      }
      var href = baseEl.getAttribute('href');
      if (!href || href === '$FLUTTER_BASE_HREF' || href === '/') {
        var path = window.location.pathname;
        if (!path.endsWith('/')) {
          path = path.substring(0, path.lastIndexOf('/') + 1);
        }
        baseEl.setAttribute('href', path || './');
      }
    })();
  </script>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WrindhaOS Productivity App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WrindhaOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WrindhaOS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FFF9F0;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFF9F0;
      z-index: 99999;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #E2E8F0;
      border-top-color: #0D5CE5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      font-weight: 700;
      font-size: 16px;
      color: #1E293B;
    }
    .loading-subtext {
      margin-top: 6px;
      font-size: 13px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="loading-text">Starting WrindhaOS...</div>
    <div class="loading-subtext">Loading productivity modules</div>
  </div>

  <script>
    // Unregister legacy service workers to prevent stale asset cache locks
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) { r.unregister(); }
      });
    }

    // Hide loader once Flutter renders
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 300);
      }
    });

    // Fallback: hide loader after timeout if event already fired
    setTimeout(function() {
      var loader = document.getElementById('loading-indicator');
      if (loader && document.querySelector('flt-glass-pane, flutter-view, canvas')) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 300);
      }
    }, 4000);
  </script>

  <!-- Modern Flutter Bootstrap Loader with fallback -->
  <script src="flutter_bootstrap.js" async onerror="loadFlutterFallback()"></script>

  <script>
    function loadFlutterFallback() {
      console.warn('flutter_bootstrap.js not found, loading flutter.js fallback...');
      var script = document.createElement('script');
      script.src = 'flutter.js';
      script.onload = function() {
        if (window._flutter && window._flutter.loader) {
          _flutter.loader.loadEntrypoint({
            onEntrypointLoaded: function(engineInitializer) {
              engineInitializer.initializeEngine().then(function(appRunner) {
                var loader = document.getElementById('loading-indicator');
                if (loader) loader.remove();
                appRunner.runApp();
              });
            }
          });
        }
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
