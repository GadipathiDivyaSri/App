name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal Android Release APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          mkdir -p build_saved
          cp build/app/outputs/flutter-apk/app-release.apk build_saved/

      - name: Build Split-per-ABI Android Release APKs
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          cp build_saved/app-release.apk build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WrindhaOS-release-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.4-apk || gh release create v1.0.4-apk --title "Wrindha OS v1.0.4 Release APK" --notes "Release APKs for Wrindha OS"
          gh release upload v1.0.4-apk build/app/outputs/flutter-apk/*.apk --clobber
