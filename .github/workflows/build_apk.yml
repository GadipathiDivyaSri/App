name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Split-per-ABI Android Release APKs
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WrindhaOS-release-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4-apk
          name: Wrindha OS v1.0.4 Release APK
          body: |
            ### Wrindha OS v1.0.4 Release APKs
            - **`app-arm64-v8a-release.apk` (~19 MB)**: Recommended for all modern Android smartphones (ARM64).
            - **`app-release.apk` (~58 MB)**: Universal APK containing all CPU architectures.
            - **`app-armeabi-v7a-release.apk` (~17 MB)**: For legacy 32-bit Android devices.
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
