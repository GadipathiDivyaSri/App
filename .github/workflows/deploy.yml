name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Vercel to ignore gh-pages branch
        run: |
          mkdir -p ./build/web/backend
          echo '{"version": 2, "ignoreCommand": "exit 0"}' > ./build/web/backend/vercel.json
          echo '{"version": 2, "ignoreCommand": "exit 0"}' > ./build/web/vercel.json

      - name: Deploy pre-built Web to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          keep_files: false
          force_orphan: false