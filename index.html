  <!-- Dynamic Base & Trailing Slash Normalization -->
  <script>
    (function() {
      var path = window.location.pathname;
      if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
        window.location.replace(path + '/' + window.location.search + window.location.hash);
        return;
      }

      var baseHref = './';
      if (path.indexOf('/WRINDHA_OS_APP') !== -1) {
        baseHref = '/WRINDHA_OS_APP/';
      } else if (path.indexOf('/App') !== -1) {
        baseHref = '/App/';
      }

      var baseEl = document.querySelector('base') || document.createElement('base');
      baseEl.href = baseHref;
      if (!baseEl.parentNode) document.head.appendChild(baseEl);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
    })();
  </script>

  <!-- MSG91 OTP Provider Widget Script -->
  <script type="text/javascript" src="https://control.msg91.com/app/assets/otp-provider/otp-provider.js"></script>
  <script>
    window.MSG91_CONFIG = {
      widgetId: "36687761466f383937303733",
      tokenAuth: "563368AbE6Nls32x6a9703baP1"
    };

    window.sendMSG91EmailOTP = function(email, liveOtp, callback) {
      console.log("[MSG91] Sending Email OTP to:", email);
      if (typeof window.initSendOTP === 'function') {
        try {
          window.initSendOTP({
            widgetId: window.MSG91_CONFIG.widgetId,
            tokenAuth: window.MSG91_CONFIG.tokenAuth,
            identifier: email,
            exposeMethods: true,
            success: function(data) {
              console.log("[MSG91 Success]:", data);
              if (callback) callback({ success: true, data: data });
            },
            failure: function(error) {
              console.warn("[MSG91 Error]:", error);
              if (callback) callback({ success: false, error: error });
            }
          });
          setTimeout(function() {
            if (typeof window.sendOTP === 'function') {
              window.sendOTP(email);
            }
          }, 300);
        } catch(e) {
          console.error("[MSG91 Widget Exception]:", e);
        }
      }
    };

    window.verifyMSG91EmailOTP = function(email, otp, callback) {
      console.log("[MSG91] Verifying OTP for:", email);
      fetch("https://control.msg91.com/api/v5/otp/verify?email=" + encodeURIComponent(email) + "&otp=" + encodeURIComponent(otp) + "&authkey=" + window.MSG91_CONFIG.tokenAuth)
        .then(function(res){ return res.json(); })
        .then(function(json){
          console.log("[MSG91 Verify Response]:", json);
          if (callback) callback(json);
        })
        .catch(function(err){
          console.warn("[MSG91 Verify Error]:", err);
          if (callback) callback({ type: "error", message: err.message });
        });
    };
  </script>
